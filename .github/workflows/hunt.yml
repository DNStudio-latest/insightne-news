# Runs the News Hunter, for free, on GitHub.
# It runs every hour, day and night (free, because the repository is public), started by Supabase
# (supabase/hunter-timer.sql): GitHub's own timer did not start it reliably.
# You can also run it by hand: GitHub > Actions > "Hunt news" > "Run workflow".
name: Hunt news

on:
  workflow_dispatch:

concurrency:
  group: hunt-news
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-24.04 # pinned: the Ubuntu 26 "latest" broke the screenshot browser install
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Free tools for reading PDFs: pdftotext/pdftoppm (poppler) and Tesseract OCR with English and Bengali.
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-ben
      - run: npm ci
      # The browser that takes the proof screenshots of the source pages.
      - run: npx playwright install --with-deps chromium
      - run: npm run hunt
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
